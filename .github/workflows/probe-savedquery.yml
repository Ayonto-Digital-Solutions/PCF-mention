# Temporary: the packer drops solution/src/Entities/ayonto_Mention/SavedQueries silently, and three
# candidate file layouts all produced zero <savedquery> in the pack. So this asks the other way
# round: build a solution that provably CONTAINS the view, then let pac unpack it and show where
# the tool itself puts the file.
name: Probe saved query

on:
  workflow_dispatch:
  push:
    branches: [claude/pcf-mention-notification-update-dfpubr]

jobs:
  probe:
    name: Where does the tool put a view
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build a package that carries the view
        run: |
          set -euo pipefail
          curl -sSL -o managed.zip \
            "https://github.com/Ayonto-Digital-Solutions/PCF-mention/releases/download/v2.2.0/AyontoPcfControls_2.2.0_managed.zip"
          mkdir -p m && unzip -q managed.zip -d m
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          query = Path("solution/src/Entities/ayonto_Mention/SavedQueries/{6f3a1c24-8d5b-4d0e-9a41-2c7b5e0f9d11}.xml").read_text(encoding="utf-8")
          inner = query.split("?>", 1)[1].strip().replace("savedqueries", "SavedQueries")

          cust = Path("m/customizations.xml").read_text(encoding="utf-8-sig")
          patched = cust.replace("</EntityInfo>\n    </Entity>",
                                 "</EntityInfo>\n      " + inner + "\n    </Entity>", 1)
          assert patched != cust, "anchor not found"
          Path("m/customizations.xml").write_text(patched, encoding="utf-8")

          with zipfile.ZipFile("managed.zip") as old, zipfile.ZipFile("withview.zip", "w", zipfile.ZIP_DEFLATED) as new:
              for item in old.infolist():
                  new.writestr(item, (Path("m") / item.filename).read_bytes())
          PY
          grep -c '<savedquery>' m/customizations.xml

      - name: Let pac unpack it and show the layout
        run: |
          set -uo pipefail
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool >/dev/null 2>&1 || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          pac solution unpack --zipfile withview.zip --folder extracted --packagetype Managed
          echo "===== Was der Packer schreibt ====="
          find extracted -type f | sort
          echo "===== Inhalt jeder Datei unter einem Ansichts-Pfad ====="
          find extracted -type f \( -ipath '*savedquer*' -o -ipath '*view*' \) -exec sh -c 'echo "--- {} ---"; cat "{}"' \;
          echo "===== Entity.xml Kopf, falls die Ansicht dort steckt ====="
          head -40 extracted/Entities/*/Entity.xml
          echo "===== steht savedquery irgendwo in der Entity.xml? ====="
          grep -c -i savedquery extracted/Entities/*/Entity.xml || echo "nein"
