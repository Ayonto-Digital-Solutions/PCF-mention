# Temporary: asks SolutionPackager which layout it accepts for a saved query, and has it
# extract the answer back so the source can be matched to what the tool itself writes.
name: Probe saved query

on:
  workflow_dispatch:
  push:
    branches: [claude/pcf-mention-notification-update-dfpubr]

jobs:
  probe:
    name: Which saved query layout packs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Pack every candidate layout and count what survived
        run: |
          set -u
          guid='{6f3a1c24-8d5b-4d0e-9a41-2c7b5e0f9d11}'
          body=$(sed -e '1d' -e 's|^<savedqueries[^>]*>$||' -e 's|^</savedqueries>$||' \
            "solution/src/Entities/ayonto_Mention/SavedQueries/${guid}.xml")

          pack () {
            local name="$1" dir="/tmp/$1"
            rm -rf "$dir"; cp -r solution "$dir"
            printf '%s' "$2" > "$dir/src/Entities/ayonto_Mention/SavedQueries/$3"
            if [ "$3" != "${guid}.xml" ]; then rm -f "$dir/src/Entities/ayonto_Mention/SavedQueries/${guid}.xml"; fi
            ( cd "$dir" && dotnet build -c Release >"/tmp/$name.log" 2>&1 ) \
              && echo "PACK OK" || { echo "PACK FAILED"; tail -20 "/tmp/$name.log"; return; }
            local zip
            zip=$(find "$dir/bin/Release" -name '*.zip' | head -1)
            rm -rf "/tmp/$name-out"; mkdir -p "/tmp/$name-out"
            unzip -q -o "$zip" -d "/tmp/$name-out"
            local n
            n=$(grep -o '<savedquery>' "/tmp/$name-out/customizations.xml" | wc -l)
            echo "::notice::$name -> $n <savedquery> im Paket"
            echo "RESULT $name = $n"
          }

          echo "===== A: wie im Repository, <savedqueries> als Wurzel ====="
          pack A "$(cat "solution/src/Entities/ayonto_Mention/SavedQueries/${guid}.xml")" "${guid}.xml"

          echo "===== B: nackte <savedquery> als Wurzel ====="
          pack B "<?xml version=\"1.0\" encoding=\"utf-8\"?>${body}" "${guid}.xml"

          echo "===== C: <savedqueries>, Dateiname ohne geschweifte Klammern ====="
          pack C "$(cat "solution/src/Entities/ayonto_Mention/SavedQueries/${guid}.xml")" "6f3a1c24-8d5b-4d0e-9a41-2c7b5e0f9d11.xml"

      - name: Let the tool write the layout itself
        run: |
          set -u
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool >/dev/null 2>&1 || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          for v in A B C; do
            zip=$(find "/tmp/$v/bin/Release" -name '*.zip' 2>/dev/null | head -1)
            [ -n "${zip:-}" ] || continue
            if grep -q '<savedquery>' "/tmp/$v-out/customizations.xml" 2>/dev/null; then
              echo "===== $v enthält die Ansicht — so schreibt der Packer sie zurück ====="
              rm -rf "/tmp/$v-extract"
              pac solution unpack --zipfile "$zip" --folder "/tmp/$v-extract" --packagetype Managed || continue
              find "/tmp/$v-extract" -path '*SavedQueries*' -print
              find "/tmp/$v-extract" -path '*SavedQueries*' -name '*.xml' -exec head -8 {} \;
            fi
          done
