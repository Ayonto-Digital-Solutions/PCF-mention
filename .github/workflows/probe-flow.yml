name: Probe flow packaging

on:
  workflow_dispatch:
  push:
    branches: [claude/pcf-mention-sendgrid-flow]

env:
  FLOW_GUID: "{7c1f5a90-3d64-4b8e-9f21-0a5c8e7b6d43}"
  FLOW_BARE: "7c1f5a90-3d64-4b8e-9f21-0a5c8e7b6d43"

jobs:
  probe:
    name: What the tools accept
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Baseline with the flow, and the sidecar pac writes back
        run: |
          set +e
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool >/dev/null 2>&1
          export PATH="$PATH:$HOME/.dotnet/tools"

          rm -rf /tmp/base && cp -r solution /tmp/base
          mkdir -p /tmp/base/src/Workflows
          cp .github/probe/flow-clientdata.json "/tmp/base/src/Workflows/AyontoSendMentionNotification-${FLOW_BARE}.json"
          python3 .github/probe/add-flow.py /tmp/base "$FLOW_GUID" "$FLOW_BARE"

          ( cd /tmp/base && dotnet build -c Release >/tmp/base.log 2>&1 ) && echo "PACK OK" || tail -20 /tmp/base.log
          zip=$(find /tmp/base/bin/Release -name '*.zip' | head -1)
          python3 .github/probe/report-package.py "$zip"

          rm -rf /tmp/base-x
          pac solution unpack --zipfile "$zip" --folder /tmp/base-x --packagetype Managed
          echo "===== Workflows/*.json.data.xml, wie pac es schreibt ====="
          cat /tmp/base-x/Workflows/*.json.data.xml

      - name: Environment variables and connection references
        run: |
          set +e
          export PATH="$PATH:$HOME/.dotnet/tools"

          try () {
            echo "############ $1 ############"
            ( cd "/tmp/$1" && dotnet build -c Release >"/tmp/$1.log" 2>&1 ) \
              && echo "PACK OK" || { echo "PACK FAILED"; tail -25 "/tmp/$1.log"; return; }
            grep -i "warning" "/tmp/$1.log" | head -5
            python3 .github/probe/report-package.py "$(find "/tmp/$1/bin/Release" -name '*.zip' | head -1)"
          }

          for candidate in E2 C1 C2; do
            rm -rf "/tmp/$candidate" && cp -r /tmp/base "/tmp/$candidate"
            rm -rf "/tmp/$candidate/bin" "/tmp/$candidate/obj"
          done

          python3 .github/probe/add-envvar.py /tmp/E2
          python3 .github/probe/add-rootcomponent.py /tmp/E2 380 ayonto_MentionSenderAddress
          try E2

          python3 .github/probe/add-connectionreference.py /tmp/C1 folder
          try C1

          python3 .github/probe/add-connectionreference.py /tmp/C2 inline
          try C2

      - name: Does pac understand them, or only copy them
        run: |
          set +e
          export PATH="$PATH:$HOME/.dotnet/tools"
          for candidate in base E2 C1 C2; do
            zip=$(find "/tmp/$candidate/bin/Release" -name '*.zip' 2>/dev/null | head -1)
            [ -n "$zip" ] || continue
            echo "############ $candidate ############"
            rm -rf "/tmp/$candidate-x"
            pac solution unpack --zipfile "$zip" --folder "/tmp/$candidate-x" --packagetype Managed 2>&1 \
              | grep -E "Processing Component|Error|error|Warning" 
            echo "--- geschriebene Dateien ---"
            ( cd "/tmp/$candidate-x" 2>/dev/null && find . -type f | sort ) || echo "(nichts entpackt)"
          done
