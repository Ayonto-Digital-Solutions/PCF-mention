# Temporary. Three questions the tools have to answer before a cloud flow can be added:
#   1. Does pac offer a YAML source-control format on unpack, so the format can be generated
#      rather than hand-written? (The docs say modern flows exist only in that format.)
#   2. Does a flow survive a pack in the classic XML format the solution uses today?
#   3. What does pac write when it unpacks a solution that carries one?
name: Probe flow packaging

on:
  workflow_dispatch:
  push:
    branches: [claude/pcf-mention-sendgrid-flow]

jobs:
  probe:
    name: Can a cloud flow be packed
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: What does pac offer
        run: |
          set -uo pipefail
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool >/dev/null 2>&1 || true
          export PATH="$PATH:$HOME/.dotnet/tools"
          pac --version
          echo "===== pac solution unpack --help ====="
          pac solution unpack --help || true
          echo "===== pac solution pack --help ====="
          pac solution pack --help || true
          echo "===== pac solution clone --help ====="
          pac solution clone --help || true

      - name: Does a flow survive the classic XML pack
        run: |
          set -uo pipefail
          guid="{7c1f5a90-3d64-4b8e-9f21-0a5c8e7b6d43}"
          bare="7c1f5a90-3d64-4b8e-9f21-0a5c8e7b6d43"
          rm -rf /tmp/F && cp -r solution /tmp/F
          mkdir -p /tmp/F/src/Workflows
          cp .github/probe/flow-clientdata.json "/tmp/F/src/Workflows/AyontoSendMentionNotification-${bare}.json"

          python3 - "$guid" "$bare" <<'PY'
          import sys
          from pathlib import Path

          guid, bare = sys.argv[1], sys.argv[2]
          entry = f"""  <Workflows>
            <Workflow WorkflowId="{guid}" Name="Ayonto - Send Mention Notification">
              <JsonFileName>/Workflows/AyontoSendMentionNotification-{bare}.json</JsonFileName>
              <Type>1</Type>
              <Subprocess>0</Subprocess>
              <Category>5</Category>
              <Mode>0</Mode>
              <Scope>4</Scope>
              <OnDemand>0</OnDemand>
              <TriggerOnCreate>0</TriggerOnCreate>
              <TriggerOnDelete>0</TriggerOnDelete>
              <AsyncAutodelete>0</AsyncAutodelete>
              <SyncWorkflowLogOnFailure>0</SyncWorkflowLogOnFailure>
              <StateCode>1</StateCode>
              <StatusCode>2</StatusCode>
              <RunAs>1</RunAs>
              <IsTransacted>1</IsTransacted>
              <IntroducedVersion>1.0.0.0</IntroducedVersion>
              <IsCustomizable>1</IsCustomizable>
              <PrimaryEntity>none</PrimaryEntity>
              <LocalizedNames>
                <LocalizedName description="Ayonto - Send Mention Notification" languagecode="1033" />
              </LocalizedNames>
            </Workflow>
          </Workflows>"""

          cust = Path("/tmp/F/src/Other/Customizations.xml")
          text = cust.read_text(encoding="utf-8")
          assert "<Workflows />" in text
          cust.write_text(text.replace("  <Workflows />", entry, 1), encoding="utf-8")

          sol = Path("/tmp/F/src/Other/Solution.xml")
          text = sol.read_text(encoding="utf-8")
          marker = '<RootComponent type="1" schemaName="ayonto_mention" behavior="0" />'
          assert marker in text
          sol.write_text(text.replace(marker, marker + f'\n      <RootComponent type="29" id="{guid}" behavior="0" />', 1), encoding="utf-8")
          print("classic candidate prepared")
          PY

          # XamlFileName is what the schema names; JsonFileName is what exports use. Try both.
          for variant in JsonFileName XamlFileName; do
            rm -rf "/tmp/F-$variant" && cp -r /tmp/F "/tmp/F-$variant"
            sed -i "s|<JsonFileName>|<$variant>|; s|</JsonFileName>|</$variant>|" \
              "/tmp/F-$variant/src/Other/Customizations.xml"
            echo "===== $variant ====="
            ( cd "/tmp/F-$variant" && dotnet build -c Release >"/tmp/$variant.log" 2>&1 ) \
              && echo "PACK OK" || { echo "PACK FAILED"; tail -30 "/tmp/$variant.log"; continue; }
            grep -i "warn" "/tmp/$variant.log" | head -5
            zip=$(find "/tmp/F-$variant/bin/Release" -name '*.zip' | head -1)
            rm -rf "/tmp/out-$variant" && mkdir -p "/tmp/out-$variant"
            unzip -q -o "$zip" -d "/tmp/out-$variant"
            echo "--- Dateien im Paket ---"; find "/tmp/out-$variant" -type f | sort
            echo "--- Workflow im customizations.xml? ---"
            grep -c "<Workflow " "/tmp/out-$variant/customizations.xml" || echo 0
          done

      - name: Unpack whichever carried the flow
        run: |
          set -uo pipefail
          export PATH="$PATH:$HOME/.dotnet/tools"
          for variant in JsonFileName XamlFileName; do
            zip=$(find "/tmp/F-$variant/bin/Release" -name '*.zip' 2>/dev/null | head -1)
            [ -n "${zip:-}" ] || continue
            grep -q "<Workflow " "/tmp/out-$variant/customizations.xml" 2>/dev/null || continue
            echo "===== $variant: so schreibt pac es zurück ====="
            rm -rf "/tmp/x-$variant"
            pac solution unpack --zipfile "$zip" --folder "/tmp/x-$variant" --packagetype Managed || continue
            find "/tmp/x-$variant" -type f | sort
            break
          done
