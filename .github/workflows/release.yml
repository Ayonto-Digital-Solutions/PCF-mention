name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Solution version, for example 2.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  SOLUTION_DIR: AyontoPcfControls

jobs:
  solution:
    name: Build and publish the Dataverse solution
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The pac CLI ships as a .NET 10 tool.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          case "${version}" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "expected a version like 2.0.0, got '${version}'" >&2; exit 1 ;;
          esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building solution version ${version}"

      - name: Install the Power Platform CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Dataverse only picks up a changed component when the component's own version moves;
      # bumping the solution alone leaves the old bundle in place.
      - name: Stamp the component versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - "$VERSION" Mention/MentionControl/ControlManifest.Input.xml \
            GroupDetailList/GroupDetailListControl/ControlManifest.Input.xml <<'PY'
          import re, sys
          version, *paths = sys.argv[1:]
          for path in paths:
              text = open(path, encoding="utf-8").read()
              patched, count = re.subn(
                  r'(<control\b[^>]*?\bversion=")[^"]*(")',
                  lambda m: m.group(1) + version + m.group(2),
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"no control version attribute in {path}")
              open(path, "w", encoding="utf-8").write(patched)
              print(f"{path}: control version set to {version}")
          PY

      # A tag push does not run ci.yml, so the same gates run here: a release must never be cut
      # from a commit that would have failed the pull request build.
      - name: Check and build the code components
        run: |
          for control in Mention GroupDetailList; do
            echo "::group::${control}"
            (
              cd "${control}"
              npm ci
              npm run refreshTypes
              npm run lint
              npm run typecheck
              npm test
              npm run build -- --buildMode production
            )
            echo "::endgroup::"
          done

      # The project is checked in rather than generated: the table that ships with the solution
      # needs a RootComponent in Solution.xml, and nothing in the build would add one.
      - name: Assemble the solution project
        run: |
          python3 .github/scripts/check-solution.py
          rm -rf "${SOLUTION_DIR}"
          cp -r solution "${SOLUTION_DIR}"
          cd "${SOLUTION_DIR}"
          pac solution add-reference --path ../Mention
          pac solution add-reference --path ../GroupDetailList

      # pac solution version only moves build and revision, so the release version is written
      # into the generated Solution.xml directly.
      # A text edit rather than an XML round trip: Solution.xml is checked in with comments
      # explaining what each part is for, and a round trip would drop them.
      - name: Stamp the solution version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - "$SOLUTION_DIR/src/Other/Solution.xml" "${VERSION}.0" <<'PY'
          import re, sys
          path, version = sys.argv[1], sys.argv[2]
          text = open(path, encoding="utf-8").read()
          patched, count = re.subn(r"<Version>[^<]*</Version>", f"<Version>{version}</Version>", text)
          if count != 1:
              raise SystemExit(f"expected exactly one <Version> in {path}, found {count}")
          open(path, "w", encoding="utf-8").write(patched)
          print(f"{path}: version set to {version}")
          PY

      - name: Pack the solution
        run: |
          ( cd "${SOLUTION_DIR}" && dotnet build -c Release )   # managed
          ( cd "${SOLUTION_DIR}" && dotnet build -c Debug )     # unmanaged

      # 2.2.0 shipped a table without its view: the packer took the SavedQueries folder and said
      # nothing. Nothing goes out again without reading the package that is about to go out.
      - name: Check what is about to be published
        run: |
          for config in Release Debug; do
            zip=$(find "${SOLUTION_DIR}/bin/${config}" -name '*.zip' | head -1)
            echo "== ${config}: ${zip}"
            SOLUTION_ROOT="${SOLUTION_DIR}" python3 .github/scripts/check-package.py "$zip" --expect-controls
            python3 .github/scripts/check-guide.py "$zip" \
              solution/README.md solution/external-mail-provider.md --expect-controls
          done

      - name: Collect the artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          version="${VERSION}"
          mkdir -p dist
          managed=$(find "${SOLUTION_DIR}/bin/Release" -name '*.zip' | head -1)
          unmanaged=$(find "${SOLUTION_DIR}/bin/Debug" -name '*.zip' | head -1)
          if [ -z "${managed}" ] || [ -z "${unmanaged}" ]; then
            echo "solution zips were not produced" >&2
            find "${SOLUTION_DIR}/bin" -type f >&2 || true
            exit 1
          fi
          cp "${managed}"   "dist/AyontoPcfControls_${version}_managed.zip"
          cp "${unmanaged}" "dist/AyontoPcfControls_${version}.zip"

          # The flow is not in the package — it is built from these documents, so they belong
          # with the download rather than only in the repository.
          pip install --quiet markdown
          python3 .github/scripts/build-docs-pdf.py \
            "dist/Ayonto-Mention-Benachrichtigung_${version}.pdf" \
            solution/README.md solution/external-mail-provider.md

          # Every file that is meant to be published, named. A glob that quietly misses one is
          # how the documentation was built and then left behind on 2.3.1.
          for expected in \
            "dist/AyontoPcfControls_${version}_managed.zip" \
            "dist/AyontoPcfControls_${version}.zip" \
            "dist/Ayonto-Mention-Benachrichtigung_${version}.pdf"; do
            if [ ! -s "${expected}" ]; then
              echo "::error::${expected} was not produced"
              ls -l dist >&2 || true
              exit 1
            fi
          done

          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: solution-${{ steps.version.outputs.version }}
          path: dist/*

      # Started by hand rather than by a tag, the tag does not exist yet: the release is cut at
      # the commit that was built, which creates it. Either way the zips end up on the release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${VERSION}"
          fi

          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" dist/* --clobber
          else
            gh release create "${tag}" dist/* \
              --target "${GITHUB_SHA}" \
              --title "${tag}" \
              --generate-notes
          fi
