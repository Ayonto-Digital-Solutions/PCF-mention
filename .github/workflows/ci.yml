name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  control:
    name: ${{ matrix.control }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        control: [Mention, GroupDetailList]
        # pcf-scripts requires Node 20 or newer; 22 is the current LTS.
        node: ["20", "22"]

    defaults:
      run:
        working-directory: ${{ matrix.control }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.control }}/package-lock.json

      - run: npm ci

      # ManifestTypes.d.ts is generated from the manifest and is not checked in,
      # so lint and typecheck have nothing to resolve against without this.
      - name: Generate manifest types
        run: npm run refreshTypes

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build -- --buildMode production

  solution:
    name: Solution source packs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The pac CLI ships as a .NET 10 tool, and the same MSBuild target packs the solution
      # here as at release time — so a table definition that SolutionPackager refuses is caught
      # on the pull request rather than on the tag.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Check the solution source
        run: python3 .github/scripts/check-solution.py

      # TEMPORARY: SolutionPackager throws a NullReferenceException on the entity, and the
      # message says nothing about which part it choked on. Packing several shapes in one run
      # is cheaper than one push per guess.
      - name: Find the shape the packer accepts
        run: |
          set +e
          for variant in full no-savedqueries no-ribbon bare; do
            rm -rf "/tmp/${variant}"
            cp -r solution "/tmp/${variant}"
            case "${variant}" in
              no-savedqueries) rm -rf "/tmp/${variant}/src/Entities/ayonto_Mention/SavedQueries" ;;
              no-ribbon)       rm -f  "/tmp/${variant}/src/Entities/ayonto_Mention/RibbonDiff.xml" ;;
              bare)            rm -rf "/tmp/${variant}/src/Entities/ayonto_Mention/SavedQueries" \
                                      "/tmp/${variant}/src/Entities/ayonto_Mention/RibbonDiff.xml" ;;
            esac
            out=$(cd "/tmp/${variant}" && dotnet build -c Release 2>&1)
            if [ $? -eq 0 ]; then
              echo "::notice::${variant}: PACKS"
            else
              echo "::warning::${variant}: FAILS"
              echo "${out}" | grep -E "error|Processing Component|^ - " | head -8
            fi
          done
          set -e

      - name: Pack it
        run: |
          rm -rf /tmp/pack
          cp -r solution /tmp/pack
          cd /tmp/pack
          dotnet build -c Release
          find bin -name '*.zip' -print
