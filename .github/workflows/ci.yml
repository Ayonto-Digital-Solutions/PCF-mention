name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  control:
    name: ${{ matrix.control }} on Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        control: [Mention, GroupDetailList]
        # pcf-scripts requires Node 20 or newer; 22 is the current LTS.
        node: ["20", "22"]

    defaults:
      run:
        working-directory: ${{ matrix.control }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.control }}/package-lock.json

      - run: npm ci

      # ManifestTypes.d.ts is generated from the manifest and is not checked in,
      # so lint and typecheck have nothing to resolve against without this.
      - name: Generate manifest types
        run: npm run refreshTypes

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Ein Schlüssel, den die Übersetzung nicht führt, fällt nicht auf Englisch zurück — er
      # kommt leer zurück, und nur für die Benutzer in dieser Sprache. Das fällt sonst niemandem
      # auf, deshalb wird es hier gezählt statt erst am fertigen Paket.
      - name: Every string has a translation
        working-directory: .
        run: python3 .github/scripts/check-strings.py ${{ matrix.control }}/${{ matrix.control }}Control

      - name: Build
        run: npm run build -- --buildMode production

  solution:
    name: Solution source packs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The pac CLI ships as a .NET 10 tool, and the same MSBuild target packs the solution
      # here as at release time — so a table definition that SolutionPackager refuses is caught
      # on the pull request rather than on the tag.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Nothing in here that a public repository must not carry
        run: |
          python3 .github/scripts/check-no-secrets.py

          # And prove that guard guards, on each shape it is meant to catch. The samples are
          # assembled here rather than written out, so the patterns never sit in a tracked file
          # and trip the very check they exist to test.
          key="S""G.abcdefghijklmnop.qrstuvwxyz012345"
          url="https://someorg.c""rm4.dynamics.com"
          secret="api""_key: \"abcdef0123456789abcdef\""
          prefix="\"z""z_mention\""
          # A link into a host nobody outside one organisation can reach — a logo on an intranet,
          # a portal — is how a real setup leaks into documentation written from it.
          host="https://www.beispiel""konzern.example.invalid/logo.png"
          # Written under Mention/, because a publisher prefix is only looked for where Dataverse
          # logical names live — at the repository root an underscore is just an underscore.
          for leak in "$key" "$url" "$secret" "$prefix" "$host"; do
            printf '%s\n' "$leak" > Mention/zz-leak-probe.md
            git add Mention/zz-leak-probe.md
            if python3 .github/scripts/check-no-secrets.py; then
              echo "::error::check-no-secrets.py let this through: $leak"
              git rm -qf Mention/zz-leak-probe.md
              exit 1
            fi
            git rm -qf Mention/zz-leak-probe.md
          done

      - name: Check the solution source
        run: |
          python3 .github/scripts/check-solution.py solution solution-flow

          # And prove the guard guards. It sat unreachable once, behind a fail() that exits.
          rm -rf /tmp/guard
          cp -r solution /tmp/guard
          printf '<?xml version="1.0"?>\n<RibbonDiffXml><CustomActions /></RibbonDiffXml>\n' \
            > /tmp/guard/src/Entities/ayonto_Mention/RibbonDiff.xml
          if python3 .github/scripts/check-solution.py /tmp/guard solution-flow; then
            echo "::error::check-solution.py accepted a RibbonDiff.xml the packer cannot read"
            exit 1
          fi

          # Same for the folder the packer reads nothing out of.
          rm -rf /tmp/guard2
          cp -r solution /tmp/guard2
          mkdir -p /tmp/guard2/src/Entities/ayonto_Mention/SavedQueries
          printf '<?xml version="1.0"?>\n<savedqueries />\n' \
            > /tmp/guard2/src/Entities/ayonto_Mention/SavedQueries/view.xml
          if python3 .github/scripts/check-solution.py /tmp/guard2 solution-flow; then
            echo "::error::check-solution.py accepted a SavedQueries folder the packer ignores"
            exit 1
          fi

          # Eight mistakes that are silent everywhere else. A column name that does not exist,
          # which Dataverse answers with null rather than an error; a column read through
          # trigger() instead of triggerOutputs(), which is always empty; a renamed action that
          # an expression still reaches for, so what it carried disappears from the message; a
          # column length in the README that no longer matches the table it is copied from; and
          # four ways the flow package can come apart — a flow described inside <Workflows>,
          # which makes the packer skip the whole component with nothing but a line in its log,
          # an id the solution does not list, a file name that no longer carries it, and a
          # connection the package never declares.
          #
          # The flow lives in one package and the table it reads in the other, so both are copied
          # and both are handed to the check: one of them alone would call every column unknown.
          python3 - <<'MUTATE'
          import shutil
          from pathlib import Path

          stem = "solution-flow/src/Workflows/AyontoSendMentionNotification-4f2b7c81-9a05-4d63-8e17-c6b3a5d24f90"
          flow, described = f"{stem}.json", f"{stem}.xml"
          entry = "solution-flow/src/Other/Customizations.xml"
          cases = {
              "typo": (flow, "body/ayonto_userid", "body/ayonto_usrid"),
              "trigger": (flow, "triggerOutputs()?['body/ayonto_subject']", "trigger()?['body/ayonto_subject']"),
              "outputs": (flow, '"Record_Link": {', '"Record_Link_": {'),
              "length": ("solution/README.md", "| `ayonto_useremail` | Text | 200 |", "| `ayonto_useremail` | Text | 100 |"),
              "flowid": (described, 'WorkflowId="{4f2b7c81-9a05-4d63-8e17-c6b3a5d24f90}"', 'WorkflowId="{4f2b7c81-9a05-4d63-8e17-c6b3a5d24f99}"'),
              "filename": (described, "/Workflows/AyontoSendMentionNotification-4f2b7c81", "/Workflows/Flow-4f2b7c81"),
              "unbound": (entry, 'connectionreferencelogicalname="ayonto_sharedcommondataserviceforapps_mention"', 'connectionreferencelogicalname="ayonto_something_else"'),
          }
          for name, (where, before, after) in cases.items():
              target = Path(f"/tmp/mutant-{name}")
              shutil.rmtree(target, ignore_errors=True)
              target.mkdir(parents=True)
              for tree in ("solution", "solution-flow"):
                  shutil.copytree(tree, target / tree)
              text = (target / where).read_text(encoding="utf-8")
              assert before in text, f"{name}: the source no longer contains {before!r}"
              (target / where).write_text(text.replace(before, after), encoding="utf-8")

          # The one the packer answers with a log line and a green build: the flow described
          # inside <Workflows> instead of in its own file. That is how it was written first, and
          # the package came out without the component.
          inline = Path("/tmp/mutant-inline")
          shutil.rmtree(inline, ignore_errors=True)
          inline.mkdir(parents=True)
          for tree in ("solution", "solution-flow"):
              shutil.copytree(tree, inline / tree)
          shard = inline / described
          body = "\n".join(
              line for line in shard.read_text(encoding="utf-8").splitlines()
              if not line.startswith(("<?xml", "<!--", "     "))
          )
          customizations = inline / entry
          customizations.write_text(
              customizations.read_text(encoding="utf-8").replace(
                  "  <Workflows />", "  <Workflows>\n" + body + "\n  </Workflows>"
              ),
              encoding="utf-8",
          )
          shard.unlink()
          MUTATE
          for mutant in /tmp/mutant-*; do
            if python3 .github/scripts/check-solution.py "$mutant/solution" "$mutant/solution-flow"; then
              echo "::error::check-solution.py read past the mistake in $mutant"
              exit 1
            fi
          done

      - name: Render the documentation
        run: |
          pip install --quiet markdown
          python3 .github/scripts/build-docs-pdf.py /tmp/docs.pdf \
            solution/README.md solution/external-mail-provider.md

      - name: Pack it and check what came out
        run: |
          set -o pipefail

          # SolutionPackager meldet eine übersprungene Komponente als Zeile im Log und packt
          # trotzdem — Rückgabewert 0, Build grün, Paket unvollständig. Genau so ist der Flow
          # beim ersten Anlauf ohne seine Komponente rausgegangen. Also wird das Log gelesen.
          check_pack_log() {
            if grep -qE "will be skipped|not defined in customizations" "$1"; then
              echo "::error::SolutionPackager skipped a component — the package is incomplete"
              grep -E "will be skipped|not defined in customizations" "$1"
              exit 1
            fi
          }

          rm -rf /tmp/pack
          cp -r solution /tmp/pack
          ( cd /tmp/pack && dotnet build -c Release ) | tee /tmp/pack.log
          check_pack_log /tmp/pack.log
          zip=$(find /tmp/pack/bin -name '*.zip' | head -1)
          echo "$zip"
          python3 .github/scripts/check-package.py "$zip"

          # The documentation is the third thing that has to be true, and the only one a person
          # follows step by step. CI packs without the code components, so this reaches the
          # columns; the release checks the labels and the component values as well.
          python3 .github/scripts/check-guide.py "$zip" \
            solution/README.md solution/external-mail-provider.md

          # And prove that guard guards, the way it actually failed: pack a source whose view
          # the packer drops, then hold the real source against it. That is what shipped in 2.2.0.
          rm -rf /tmp/pack-guard
          cp -r solution /tmp/pack-guard
          python3 - <<'GUARD'
          from pathlib import Path

          entity = Path("/tmp/pack-guard/src/Entities/ayonto_Mention/Entity.xml")
          text = entity.read_text(encoding="utf-8")
          head, marker, _ = text.partition("  <SavedQueries>")
          assert marker, "the source no longer has a view to take away"
          entity.write_text(head + "</Entity>\n", encoding="utf-8")
          GUARD
          ( cd /tmp/pack-guard && dotnet build -c Release )
          viewless=$(find /tmp/pack-guard/bin -name '*.zip' | head -1)
          if python3 .github/scripts/check-package.py "$viewless"; then
            echo "::error::check-package.py did not notice the view missing from the package"
            exit 1
          fi

      - name: Pack the flow package and check what came out
        run: |
          set -o pipefail

          # SolutionPackager meldet eine übersprungene Komponente als Zeile im Log und packt
          # trotzdem — Rückgabewert 0, Build grün, Paket unvollständig. Genau so ist der Flow
          # beim ersten Anlauf ohne seine Komponente rausgegangen. Also wird das Log gelesen.
          check_pack_log() {
            if grep -qE "will be skipped|not defined in customizations" "$1"; then
              echo "::error::SolutionPackager skipped a component — the package is incomplete"
              grep -E "will be skipped|not defined in customizations" "$1"
              exit 1
            fi
          }

          # Unmanaged, immer: das Paket lebt davon, angepasst zu werden.
          rm -rf /tmp/pack-flow
          cp -r solution-flow /tmp/pack-flow
          ( cd /tmp/pack-flow && dotnet build -c Debug ) | tee /tmp/pack-flow.log
          check_pack_log /tmp/pack-flow.log
          zip=$(find /tmp/pack-flow/bin -name '*.zip' | head -1)
          echo "$zip"
          SOLUTION_ROOT=/tmp/pack-flow python3 .github/scripts/check-package.py "$zip" \
            --contract .github/flow-solution-contract.json

          # Und die Gegenprobe, an der Stelle, an der es wirklich weh tut: ohne die Deklaration
          # der Verbindung importiert der Flow ungebunden und tut nichts — und der Name stünde
          # trotzdem im Paket, weil der Flow ihn selbst nennt.
          rm -rf /tmp/pack-flow-guard
          cp -r solution-flow /tmp/pack-flow-guard
          python3 - <<'GUARD'
          import re
          from pathlib import Path

          entry = Path("/tmp/pack-flow-guard/src/Other/Customizations.xml")
          text = entry.read_text(encoding="utf-8")
          stripped = re.sub(r"  <connectionreferences>.*?</connectionreferences>\n", "", text, flags=re.S)
          assert stripped != text, "the source no longer declares a connection reference to take away"
          entry.write_text(stripped, encoding="utf-8")
          GUARD
          ( cd /tmp/pack-flow-guard && dotnet build -c Debug )
          unbound=$(find /tmp/pack-flow-guard/bin -name '*.zip' | head -1)
          if SOLUTION_ROOT=/tmp/pack-flow-guard python3 .github/scripts/check-package.py "$unbound" \
               --contract .github/flow-solution-contract.json; then
            echo "::error::check-package.py did not notice the connection reference missing from the package"
            exit 1
          fi
